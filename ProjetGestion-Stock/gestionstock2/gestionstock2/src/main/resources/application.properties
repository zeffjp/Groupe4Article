spring.application.name=gestionstock2

# Configuration de la source de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_stock
spring.datasource.username=root
spring.datasource.password=passer
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration de Hibernate
spring.jpa.properties.hibernate.dialect=${hibernate.dialect}
# If you are using MySQL 5.7 or earlier, use the following line instead:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=update

# Activer la console H2 (uniquement si vous utilisez H2 pour les tests)
# spring.h2.console.enabled=true

# Configuration du port du serveur (choisissez un port différent de 3306)
server.port=8080
